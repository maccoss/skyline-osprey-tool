Provider = https://skyline.ms
Languages = C#
Description = Osprey Tool: interactive peptide detection, peak picking, and confidence scoring for large PRM experiments, using the Osprey search engine in-process. Detects candidates with Osprey CWT and picks the peak with Osprey's learned linear model over co-elution, intensity, retention time and the library spectral match (median_polish_cosine), reconciles across replicates and charge states, and (optionally) computes genuine-decoy Percolator FDR. Writes reconciled peak boundaries back to Skyline.\
\
Requires Skyline-daily and the .NET 8.0 Desktop Runtime.
