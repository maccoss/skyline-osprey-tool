Name = Osprey Tool
Version = 0.1.0
Identifier = URN:LSID:maccosslab.org:OspreyTool
Author = MacCoss Lab
Organization = MacCoss Lab, UW
Provider = https://skyline.ms
Languages = C#
Description = Osprey Tool: interactive peptide detection, peak picking, and confidence scoring for large PRM experiments, using the Osprey search engine in-process. Re-picks peaks with Osprey CWT + the DIA-NN co-elution score (optionally + median_polish_cosine spectral match), reconciles across replicates and charge states, and (optionally) computes genuine-decoy Percolator FDR. Writes reconciled peak boundaries back to Skyline.\
\
Requires Skyline-daily and the .NET 8.0 Desktop Runtime.
