# Release, triggered by pushing a v* tag. Pushing the tag both builds the artifacts and creates the
# GitHub Release - do not hand-create the Release.
#
# Publishes:
#   OspreyTool.zip           the Skyline external tool (needs the .NET 8 Desktop Runtime)
#   ospreytool-win-x64.zip   the command-line tool (needs the .NET 8 Runtime)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Keep in step with ci.yml. Pinned so a release cannot be built against an Osprey nobody tested.
  PWIZ_REF: 7e1bb52694ac6a9309b09d02ee531be6e7131f42

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The two version sources must match the tag (vX.Y.Z -> X.Y.Z), so the Skyline tool manifest - which
      # Skyline keys upgrade detection on - can never disagree with what the assemblies report.
      - name: Verify version matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n 's/^Version = //p' dotnet/src/OspreyTool.App/tool-inf/info.properties | tr -d '[:space:]')
          PROPS=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props | tr -d '[:space:]')
          echo "tag=$TAG  manifest=$MANIFEST  props=$PROPS"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::info.properties Version ($MANIFEST) does not match the tag ($TAG)"
            exit 1
          fi
          if [ "$TAG" != "$PROPS" ]; then
            echo "::error::Directory.Build.props Version ($PROPS) does not match the tag ($TAG)"
            exit 1
          fi

      # The tag is v<version> and the notes are RELEASE_NOTES_v<version>.md, so the path follows from the tag.
      # Resolved in its own step (as in skyline-prism) so a missing or empty file fails here with an actionable
      # message, rather than publishing a Release with an empty body - which is the failure mode that is easy
      # to miss, because the artifacts still attach and the workflow still goes green.
      - name: Locate the release notes
        id: notes
        shell: bash
        run: |
          NOTES="release-notes/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Expected release notes at $NOTES. Rename the draft (release-notes/RELEASE_NOTES_next.md) to match the tag before tagging - see the Release process in release-notes/README.md."
            exit 1
          fi
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is empty; the Release body would be blank."
            exit 1
          fi
          echo "Using release notes: $NOTES ($(wc -l < "$NOTES") lines)"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Checkout Osprey from pwiz (sparse)
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ProteoWizard/pwiz.git pwiz
          cd pwiz
          git sparse-checkout init --cone
          git sparse-checkout set pwiz_tools/Osprey pwiz_tools/Shared/Lib/DotNetZip pwiz_tools/Shared/Lib/Parquet
          git checkout "$PWIZ_REF"
          # A NATIVE path: bash `pwd` on a Windows runner yields an MSYS path (/d/a/...) that MSBuild cannot
          # resolve - and MSBuild only warns about the missing ProjectReference, so the build fails much later
          # with a wall of "type not found" errors. github.workspace is the Windows path.
          echo "OSPREY_DIR=${{ github.workspace }}\pwiz\pwiz_tools\Osprey" >> "$GITHUB_ENV"

      - name: Confirm Osprey resolved
        shell: bash
        run: test -f "$OSPREY_DIR/Osprey.Core/Osprey.Core.csproj" && echo "Osprey at $OSPREY_DIR"

      - name: Test
        run: dotnet test dotnet/OspreyTool.sln -c Release

      - name: Package OspreyTool.zip
        run: dotnet build dotnet/build/package.proj -c Release

      # Loads the whole dependency graph and runs the engine once; a zip that merely opens a window is not
      # good enough, because .NET would not load a missing engine DLL until the user pressed Run.
      - name: Verify the packaged tool
        shell: pwsh
        run: pwsh -File dotnet/build/verify-tool.ps1

      - name: Publish the CLI (win-x64)
        shell: bash
        run: |
          dotnet publish dotnet/src/OspreyTool.Cli/OspreyTool.Cli.csproj -c Release -r win-x64 \
            --self-contained false -o dist/ospreytool-win-x64
          powershell -Command "Compress-Archive -Path dist/ospreytool-win-x64 -DestinationPath ospreytool-win-x64.zip"

      - name: Publish the GitHub Release
        # v3 only moves the action runtime from Node 20 to Node 24 (same inputs); v2 is Node 20, which the
        # runners now force onto Node 24 anyway and warn about. Matches skyline-prism.
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dotnet/publish/OspreyTool.zip
            ospreytool-win-x64.zip
          body_path: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
